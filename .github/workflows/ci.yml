name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # No install step: the studio ships zero dependencies and the tests run
      # on node:test. If this ever needs `npm ci`, the tool stopped being
      # "download and double-click".
      - run: npm test
